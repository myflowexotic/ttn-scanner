<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="theme-color" content="#0f172a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <title>TTN SMART SCANNER</title>
    <!-- Используем стабильную версию Tesseract -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4.0.2/dist/tesseract.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --app-blue: #3b82f6; --app-dark: #0f172a; }
        body { 
            background-color: var(--app-dark); 
            -webkit-tap-highlight-color: transparent; 
            overflow-x: hidden;
            overscroll-behavior-y: contain;
            user-select: none;
        }
        
        #video-container {
            position: relative; width: 100%; aspect-ratio: 3/4; overflow: hidden;
            border-radius: 24px; border: 2px solid rgba(255,255,255,0.1); background: #000;
        }
        
        video { width: 100%; height: 100%; object-fit: cover; }

        #scan-region {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 85%; height: 30%;
            border: 2px solid rgba(59, 130, 246, 0.6);
            border-radius: 12px;
            box-shadow: 0 0 0 5000px rgba(15, 23, 42, 0.75);
            z-index: 10;
            display: none;
        }

        #scanner-line {
            position: absolute; top: 0; left: 0; width: 100%; height: 2px;
            background: var(--app-blue); box-shadow: 0 0 15px 3px var(--app-blue);
            animation: scan-line 2s ease-in-out infinite;
        }

        @keyframes scan-line { 0%, 100% { top: 10%; opacity: 0.2; } 50% { top: 90%; opacity: 0.6; } }
        .stats-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body class="text-slate-200 p-4 font-sans">

    <header class="text-center mb-6 pt-4">
        <h1 class="text-xl font-black text-white uppercase italic">TTN <span class="text-blue-500">APP</span></h1>
        <p id="system-msg" class="text-[10px] font-bold text-blue-400/60 mt-1 uppercase tracking-widest">Инициализация...</p>
    </header>

    <div class="max-w-md mx-auto space-y-6">
        <div id="video-container">
            <video id="video" autoplay playsinline muted></video>
            <div id="scan-region">
                <div id="scanner-line"></div>
                <div class="absolute -top-8 left-0 w-full text-center">
                    <span id="scan-status" class="text-[9px] font-bold text-blue-400 uppercase tracking-widest opacity-50">Ожидание...</span>
                </div>
            </div>
            
            <div id="ocr-loader" class="absolute inset-0 bg-blue-600/20 hidden flex flex-col items-center justify-center z-20 backdrop-blur-sm">
                <div class="bg-slate-900/90 p-6 rounded-3xl border border-blue-500/50">
                    <div class="w-10 h-10 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mx-auto"></div>
                    <div class="text-[10px] mt-4 font-black text-white uppercase tracking-widest">Обработка...</div>
                </div>
            </div>
        </div>

        <button id="start-btn" class="w-full bg-blue-600 active:bg-blue-700 py-5 rounded-2xl font-black text-white shadow-lg uppercase text-sm tracking-widest transition-all">
            Запустить сканер
        </button>

        <div id="results-list" class="space-y-3 pb-24"></div>
    </div>

    <audio id="beep" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "", // ВСТАВЬТЕ ВАШ КЛЮЧ
            authDomain: "main-f6446.firebaseapp.com",
            projectId: "main-f6446",
            appId: "1:733541253938:web:67d2af040d637199050d2b",
        };

        const APP_ID = "supplier-tracker-v1";
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const video = document.getElementById('video');
        const startBtn = document.getElementById('start-btn');
        const resultsList = document.getElementById('results-list');
        const scanStatus = document.getElementById('scan-status');
        const sysMsg = document.getElementById('system-msg');
        
        const SUPPLIERS_LIST = ["АвтоБот", "АвтоНова", "АвтоПалас", "АвтоСпейс", "АвтоТракМоторс", "Автоцентр Север", "АгроФильтр", "Альтра", "Аобел", "Автовар", "АС Север", "Автогаз", "АвтоИдея", "АвтоТраст", "Агромаш", "Аквилон", "АвтоАмазис", "Атлант Премиум", "Боровая", "БЭР-Авто", "БАМС", "Белагро", "БелИнвестЗапчасть", "БелИнвесТорг", "БелМоторДеталь", "БелОил", "БелСтартер", "БелТБ", "Боникс", "ВАЙБЕР", "Визит-Фвто", "Виланд", "ГаммаПлюс", "ГрандОйл", "Диал", "Диас", "Дизель-Кама", "Дюкон", "Дюлвин", "ЕвроЗапчасть", "Запад", "Инструментальный", "ИнтСелПартс", "КарПротект", "КолесоПлюс", "Крипан", "Л-авто", "Лада", "Ленсвязь", "Линник", "Мазикбай", "Мари", "Микро Альянс", "Модников", "Монлибон", "Мотехс", "МоторАвтоГрад", "Немецкая тройка", "НикадагАвто", "ОЕМ", "ЛОйл", "Омега", "ОстХим", "Парад", "ПартсБест", "Почта", "ПС АвтоГруп", "РемАвтоСнаб", "РимБат", "РосАвтоком", "Свиат", "СиванаБел", "Сплат", "ТГ", "ТрансКонсалт", "ТурбоТракс", "Фелокт", "Фильтрация", "Форвард", "Форсаж", "Фострейд", "Францемоторс", "Центр (Восток)", "Шате", "Эквипмент", "ЭкспертОйл", "Энергия"];

        let worker = null;
        let isOcrReady = false;
        let scanInProgress = false;

        // Инициализация Tesseract заранее
        async function initOCR() {
            sysMsg.innerText = "Загрузка движка...";
            worker = await Tesseract.createWorker({
                logger: m => {
                    if (m.status === 'recognizing text') {
                        scanStatus.innerText = `Анализ ${Math.round(m.progress * 100)}%`;
                    }
                }
            });
            await worker.loadLanguage('rus');
            await worker.initialize('rus');
            isOcrReady = true;
            sysMsg.innerText = "Система готова";
        }

        initOCR();

        startBtn.addEventListener('click', async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment", width: { ideal: 1280 } } 
                });
                video.srcObject = stream;
                startBtn.style.display = 'none';
                document.getElementById('scan-region').style.display = 'block';
                
                await signInAnonymously(auth).catch(() => {});
                
                // Основной цикл
                loop();
            } catch (err) {
                alert("Камера недоступна: " + err.message);
            }
        });

        async function loop() {
            if (!scanInProgress && isOcrReady && video.readyState === 4) {
                await processFrame();
            }
            setTimeout(loop, 1500); // Интервал между попытками
        }

        async function processFrame() {
            scanInProgress = true;
            scanStatus.innerText = "Считывание...";

            const canvas = document.createElement('canvas');
            canvas.width = 640;
            canvas.height = 320;
            const ctx = canvas.getContext('2d');
            
            // Вырезаем центральную область
            const vW = video.videoWidth;
            const vH = video.videoHeight;
            ctx.drawImage(video, vW * 0.1, vH * 0.35, vW * 0.8, vH * 0.3, 0, 0, 640, 320);

            try {
                const { data: { text } } = await worker.recognize(canvas);
                const rawText = text.toLowerCase();
                
                for (let supplier of SUPPLIERS_LIST) {
                    if (rawText.includes(supplier.toLowerCase())) {
                        await registerSupplier(supplier);
                        break;
                    }
                }
            } catch (e) {
                console.error(e);
            } finally {
                scanInProgress = false;
                scanStatus.innerText = "Ожидание...";
            }
        }

        async function registerSupplier(name) {
            const id = name.replace(/\s+/g, "_").toLowerCase();
            if (document.getElementById(`item-${id}`)) return;

            document.getElementById('ocr-loader').style.display = 'flex';
            const time = new Date().toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });

            // 1. Показываем на экране сразу
            const el = document.createElement('div');
            el.id = `item-${id}`;
            el.className = "stats-card p-4 rounded-2xl flex justify-between items-center border-l-4 border-blue-500 animate-pulse";
            el.innerHTML = `
                <div>
                    <div class="text-[8px] text-blue-400 font-bold uppercase tracking-widest">Прибыл</div>
                    <div class="font-black text-white uppercase text-sm">${name}</div>
                </div>
                <div class="text-blue-500 font-mono text-xs font-bold">${time}</div>
            `;
            resultsList.prepend(el);
            document.getElementById('beep').play().catch(() => {});

            // 2. Пробуем сохранить в Firebase
            try {
                if (auth.currentUser) {
                    const docRef = doc(db, "artifacts", APP_ID, "public", "data", "arrivals", id);
                    await setDoc(docRef, { name, time, timestamp: serverTimestamp() }, { merge: true });
                }
            } catch (e) {
                console.warn("Firebase save skipped (No API Key or Offline)");
            } finally {
                document.getElementById('ocr-loader').style.display = 'none';
            }
        }
    </script>
</body>
</html>
