<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <title>TTN SMART SCANNER - SYNC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --app-blue: #3b82f6; --app-dark: #0f172a; }
        body { background-color: var(--app-dark); margin: 0; display: flex; flex-direction: column; align-items: center; font-family: sans-serif; }
        #video-container { position: relative; width: 100%; max-width: 500px; aspect-ratio: 3/4; overflow: hidden; border-radius: 24px; border: 2px solid rgba(255,255,255,0.1); background: #000; }
        video { width: 100%; height: 100%; object-fit: cover; }
        #scan-region { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 85%; height: 30%; border: 2px solid rgba(59, 130, 246, 0.8); border-radius: 12px; box-shadow: 0 0 0 5000px rgba(15, 23, 42, 0.8); z-index: 10; display: none; pointer-events: none; }
        #scanner-line { position: absolute; top: 0; left: 0; width: 100%; height: 2px; background: var(--app-blue); box-shadow: 0 0 15px 3px var(--app-blue); animation: scan-line 2s ease-in-out infinite; }
        @keyframes scan-line { 0%, 100% { top: 10%; opacity: 0.2; } 50% { top: 90%; opacity: 0.8; } }
        .stats-card { background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        #ocr-loader { z-index: 50; }
    </style>
</head>
<body class="text-slate-200 p-4">

    <header class="text-center mb-6 pt-4 w-full">
        <h1 class="text-xl font-black text-white uppercase italic tracking-tighter">TTN <span class="text-blue-500">SYNC SCAN</span></h1>
        <p id="system-msg" class="text-[10px] font-bold text-blue-400 mt-1 uppercase tracking-widest bg-blue-500/10 py-1 px-3 rounded-full inline-block">Инициализация...</p>
    </header>

    <div class="w-full max-w-md space-y-6">
        <div id="video-container">
            <video id="video" autoplay playsinline muted></video>
            <div id="scan-region">
                <div id="scanner-line"></div>
                <div class="absolute -bottom-10 left-0 w-full text-center">
                    <span id="scan-status" class="text-[10px] font-black text-blue-400 uppercase tracking-widest">Наведите на название поставщика</span>
                </div>
            </div>
            
            <div id="ocr-loader" class="absolute inset-0 bg-slate-900/60 hidden flex flex-col items-center justify-center backdrop-blur-sm">
                <div class="bg-slate-900 p-6 rounded-3xl border-2 border-blue-500/50 shadow-2xl text-center">
                    <div class="w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mx-auto"></div>
                    <div class="text-[10px] mt-4 font-black text-white uppercase tracking-widest">Обновление дашборда...</div>
                </div>
            </div>
        </div>

        <button id="start-btn" class="w-full bg-blue-600 py-5 rounded-2xl font-black text-white uppercase text-sm tracking-widest shadow-lg active:scale-95 transition-all">
            Запустить сканер
        </button>

        <div id="results-list" class="space-y-3 pb-10">
            <!-- Список последних отмеченных -->
        </div>
    </div>

    <audio id="beep" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <script type="module">
        import Tesseract from 'https://cdn.jsdelivr.net/npm/tesseract.js@4.0.2/+esm';
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, updateDoc, collection, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "", // Ключ будет вставлен окружением
            authDomain: "main-f6446.firebaseapp.com",
            projectId: "main-f6446",
            appId: "1:733541253938:web:67d2af040d637199050d2b",
        };

        const APP_ID = "supplier-tracker-v1";
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const video = document.getElementById('video');
        const startBtn = document.getElementById('start-btn');
        const resultsList = document.getElementById('results-list');
        const sysMsg = document.getElementById('system-msg');
        
        let worker = null;
        let isOcrReady = false;
        let scanInProgress = false;
        let userAuth = null;

        // Список для сопоставления (должен совпадать с дашбордом)
        const SUPPLIERS_LIST = ["АвтоБот", "АвтоНова", "АвтоПалас", "АвтоСпейс", "АвтоТракМоторс", "Автоцентр Север", "АгроФильтр", "Альтра", "Аобел", "Автовар", "АС Север", "Автогаз", "АвтоИдея", "АвтоТраст", "Агромаш", "Аквилон", "АвтоАмазис", "Атлант Премиум", "Боровая", "БЭР-Авто", "БАМС", "Белагро", "БелИнвестЗапчасть", "БелИнвесТорг", "БелМоторДеталь", "БелОил", "БелСтартер", "БелТБ", "Боникс", "ВАЙБЕР", "Визит-Фвто", "Виланд", "ГаммаПлюс", "ГрандОйл", "Диал", "Диас", "Дизель-Кама", "Дюкон", "Дюлвин", "ЕвроЗапчасть", "Запад", "Инструментальный", "ИнтСелПартс", "КарПротект", "КолесоПлюс", "Крипан", "Л-авто", "Лада", "Ленсвязь", "Линник", "Мазикбай", "Мари", "Микро Альянс", "Модников", "Монлибон", "Мотехс", "МоторАвтоГрад", "Немецкая тройка", "НикадагАвто", "ОЕМ", "ЛОйл", "Омега", "ОстХим", "Парад", "ПартсБест", "Почта", "ПС АвтоГруп", "РемАвтоСнаб", "РимБат", "РосАвтоком", "Свиат", "СиванаБел", "Сплат", "ТГ", "ТрансКонсалт", "ТурбоТракс", "Фелокт", "Фильтрация", "Форвард", "Форсаж", "Фострейд", "Францемоторс", "Центр (Восток)", "Шате", "Эквипмент", "ЭкспертОйл", "Энергия"];

        const init = async () => {
            try {
                const cred = await signInAnonymously(auth);
                userAuth = cred.user;
                sysMsg.innerText = "Облако: OK";
                listenToSync();
            } catch (e) { sysMsg.innerText = "Ошибка входа"; }
        };

        // Следим за изменениями, чтобы видеть что "Прибыло"
        function listenToSync() {
            const q = collection(db, 'artifacts', APP_ID, 'public', 'data', 'suppliers');
            onSnapshot(q, (snap) => {
                const arrived = [];
                snap.forEach(d => {
                    const data = d.data();
                    if (data.status === 'arrived') arrived.push(data);
                });
                arrived.sort((a,b) => b.lastUpdated?.seconds - a.lastUpdated?.seconds);
                
                resultsList.innerHTML = arrived.slice(0, 5).map(item => `
                    <div class="stats-card p-4 rounded-2xl flex justify-between items-center border-l-4 border-green-500 shadow-lg">
                        <div>
                            <div class="text-[8px] text-green-400 font-bold uppercase">Обновлено</div>
                            <div class="font-black text-white uppercase text-sm">${item.name}</div>
                        </div>
                        <div class="text-green-500 font-mono text-xs font-bold bg-green-500/10 px-2 py-1 rounded-lg">ПРИБЫЛ</div>
                    </div>
                `).join('');
            });
        }

        async function startScanner() {
            startBtn.disabled = true;
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment", width: { ideal: 1280 } } 
                });
                video.srcObject = stream;
                await video.play();
                startBtn.style.display = 'none';
                document.getElementById('scan-region').style.display = 'block';
                sysMsg.innerText = "Загрузка OCR...";
                await initOCR();
                sysMsg.innerText = "Сканер активен";
                scanLoop();
            } catch (err) { sysMsg.innerText = "Нет доступа к камере"; }
        }

        async function initOCR() {
            worker = await Tesseract.createWorker();
            await worker.loadLanguage('rus');
            await worker.initialize('rus');
            await worker.setParameters({ tessedit_char_whitelist: 'АБВГДЕЁЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯ- ' });
            isOcrReady = true;
        }

        async function scanLoop() {
            if (!scanInProgress && isOcrReady && video.readyState >= 2) {
                await processFrame();
            }
            setTimeout(scanLoop, 1500);
        }

        async function processFrame() {
            scanInProgress = true;
            const canvas = document.createElement('canvas');
            canvas.width = 640; canvas.height = 320;
            const ctx = canvas.getContext('2d');
            // Кропаем центральную зону
            ctx.drawImage(video, video.videoWidth * 0.1, video.videoHeight * 0.35, video.videoWidth * 0.8, video.videoHeight * 0.3, 0, 0, 640, 320);

            try {
                const { data: { text } } = await worker.recognize(canvas);
                const rawText = text.toLowerCase();
                for (let supplier of SUPPLIERS_LIST) {
                    if (rawText.includes(supplier.toLowerCase())) {
                        await syncWithDashboard(supplier);
                        break;
                    }
                }
            } catch (e) {} finally { scanInProgress = false; }
        }

        async function syncWithDashboard(name) {
            const docId = name.replace(/\s+/g, "_").toLowerCase();
            document.getElementById('ocr-loader').classList.remove('hidden');
            
            try {
                const docRef = doc(db, "artifacts", APP_ID, "public", "data", "suppliers", docId);
                const now = new Date();
                const timeStr = now.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
                
                await updateDoc(docRef, {
                    status: "arrived",
                    arrivalTime: timeStr,
                    lastUpdated: serverTimestamp()
                });

                if (navigator.vibrate) navigator.vibrate(100);
                document.getElementById('beep').play().catch(()=>{});
            } catch (e) {
                console.error("Sync error", e);
            } finally {
                setTimeout(() => document.getElementById('ocr-loader').classList.add('hidden'), 800);
            }
        }

        startBtn.addEventListener('click', startScanner);
        init();
    </script>
</body>
</html>
