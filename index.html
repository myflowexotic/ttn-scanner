<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="theme-color" content="#0f172a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    
    <title>TTN SMART SCANNER</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --app-blue: #3b82f6; --app-dark: #0f172a; }
        body { 
            background-color: var(--app-dark); 
            -webkit-tap-highlight-color: transparent; 
            overflow-x: hidden;
            overscroll-behavior-y: contain;
            user-select: none;
        }
        
        #video-container {
            position: relative; width: 100%; aspect-ratio: 3/4; overflow: hidden;
            border-radius: 24px; border: 2px solid rgba(255,255,255,0.1); background: #000;
        }
        
        video { 
            width: 100%; height: 100%; object-fit: cover; 
        }

        #scan-region {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 85%; height: 35%;
            border: 2px solid rgba(59, 130, 246, 0.3);
            border-radius: 12px;
            box-shadow: 0 0 0 5000px rgba(15, 23, 42, 0.75);
            z-index: 10;
            display: none;
        }

        .corner { position: absolute; width: 20px; height: 20px; border: 4px solid var(--app-blue); }
        .tl { top: -2px; left: -2px; border-right: 0; border-bottom: 0; border-radius: 10px 0 0 0; }
        .tr { top: -2px; right: -2px; border-left: 0; border-bottom: 0; border-radius: 0 10px 0 0; }
        .bl { bottom: -2px; left: -2px; border-right: 0; border-top: 0; border-radius: 0 0 0 10px; }
        .br { bottom: -2px; right: -2px; border-left: 0; border-top: 0; border-radius: 0 0 10px 0; }

        #scanner-line {
            position: absolute; top: 0; left: 0; width: 100%; height: 2px;
            background: var(--app-blue); box-shadow: 0 0 15px 3px var(--app-blue);
            animation: scan-line 2s ease-in-out infinite;
        }

        @keyframes scan-line { 0%, 100% { top: 10%; opacity: 0.2; } 50% { top: 90%; opacity: 0.6; } }
        .stats-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body class="text-slate-200 p-4 font-sans">

    <header class="text-center mb-6 pt-4">
        <h1 class="text-xl font-black text-white uppercase italic">TTN <span class="text-blue-500">APP</span></h1>
        <p class="text-[10px] font-bold text-blue-400/60 mt-1 uppercase tracking-widest">Система мгновенного прихода</p>
    </header>

    <div class="max-w-md mx-auto space-y-6">
        <div id="video-container">
            <video id="video" autoplay playsinline muted></video>
            <div id="scan-region">
                <div class="corner tl"></div><div class="corner tr"></div>
                <div class="corner bl"></div><div class="corner br"></div>
                <div id="scanner-line"></div>
            </div>
            
            <div id="ocr-loader" class="absolute inset-0 bg-blue-600/20 hidden flex flex-col items-center justify-center z-20 backdrop-blur-sm">
                <div class="bg-slate-900/90 p-6 rounded-3xl flex flex-col items-center border border-blue-500/50">
                    <div class="w-10 h-10 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
                    <div class="text-[10px] mt-4 font-black text-white uppercase tracking-widest">Обработка...</div>
                </div>
            </div>
        </div>

        <button id="start-btn" class="w-full bg-blue-600 active:bg-blue-700 py-5 rounded-2xl font-black text-white shadow-lg uppercase text-sm tracking-widest">
            Запустить камеру
        </button>

        <div id="results-list" class="space-y-3 pb-24"></div>
    </div>

    <audio id="beep" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "", 
            authDomain: "main-f6446.firebaseapp.com",
            projectId: "main-f6446",
            appId: "1:733541253938:web:67d2af040d637199050d2b",
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const video = document.getElementById('video');
        const startBtn = document.getElementById('start-btn');
        const scanRegion = document.getElementById('scan-region');
        const beep = document.getElementById('beep');
        const resultsList = document.getElementById('results-list');

        const SUPPLIERS_LIST = ["АвтоБот", "АвтоНова", "АвтоПалас", "АвтоСпейс", "АвтоТракМоторс", "Автоцентр Север", "АгроФильтр", "Альтра", "Аобел", "Автовар", "АС Север", "Автогаз", "АвтоИдея", "АвтоТраст", "Агромаш", "Аквилон", "АвтоАмазис", "Атлант Премиум", "Боровая", "БЭР-Авто", "БАМС", "Белагро", "БелИнвестЗапчасть", "БелИнвесТорг", "БелМоторДеталь", "БелОил", "БелСтартер", "БелТБ", "Боникс", "ВАЙБЕР", "Визит-Фвто", "Виланд", "ГаммаПлюс", "ГрандОйл", "Диал", "Диас", "Дизель-Кама", "Дюкон", "Дюлвин", "ЕвроЗапчасть", "Запад", "Инструментальный", "ИнтСелПартс", "КарПротект", "КолесоПлюс", "Крипан", "Л-авто", "Лада", "Ленсвязь", "Линник", "Мазикбай", "Мари", "Микро Альянс", "Модников", "Монлибон", "Мотехс", "МоторАвтоГрад", "Немецкая тройка", "НикадагАвто", "ОЕМ", "ЛОйл", "Омега", "ОстХим", "Парад", "ПартсБест", "Почта", "ПС АвтоГруп", "РемАвтоСнаб", "РимБат", "РосАвтоком", "Свиат", "СиванаБел", "Сплат", "ТГ", "ТрансКонсалт", "ТурбоТракс", "Фелокт", "Фильтрация", "Форвард", "Форсаж", "Фострейд", "Францемоторс", "Центр (Восток)", "Шате", "Эквипмент", "ЭкспертОйл", "Энергия"];

        startBtn.addEventListener('click', async () => {
            try {
                // Пытаемся получить доступ к задней камере
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: { exact: "environment" } } 
                }).catch(() => {
                    // Если точное совпадение не сработало (например, на ПК), пробуем обычную камеру
                    return navigator.mediaDevices.getUserMedia({ video: true });
                });

                video.srcObject = stream;
                video.setAttribute("playsinline", true); 
                video.play();
                
                startBtn.style.display = 'none';
                scanRegion.style.display = 'block';
                signInAnonymously(auth);
                startScanning();
            } catch (err) {
                console.error(err);
                alert("Ошибка камеры: " + err.message + "\nУбедитесь, что разрешили доступ к камере в браузере.");
            }
        });

        async function startScanning() {
            while (true) {
                if (!video.paused && video.readyState === 4) {
                    await performOCR();
                }
                await new Promise(r => setTimeout(r, 2000));
            }
        }

        async function performOCR() {
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);

            const result = await Tesseract.recognize(canvas, 'rus');
            const text = result.data.text.toLowerCase();
            
            for (let supplier of SUPPLIERS_LIST) {
                if (text.includes(supplier.toLowerCase())) {
                    await saveArrival(supplier);
                    break;
                }
            }
        }

        async function saveArrival(name) {
            const docId = name.replace(/\s+/g, "_").toLowerCase();
            if (document.getElementById(`res-${docId}`)) return;

            beep.play();
            const time = new Date().toLocaleTimeString();
            
            try {
                const docRef = doc(db, "artifacts", "supplier-tracker-v1", "public", "data", "suppliers", docId);
                await updateDoc(docRef, { status: "arrived", arrivalTime: time, lastUpdated: serverTimestamp() });
                
                const el = document.createElement('div');
                el.id = `res-${docId}`;
                el.className = "stats-card p-4 rounded-2xl flex justify-between items-center border-l-4 border-blue-500";
                el.innerHTML = `<div><div class="text-[8px] text-slate-500 uppercase font-bold">Прибыл</div><div class="font-black text-xs text-white uppercase">${name}</div></div><div class="text-blue-400 font-mono text-xs">${time}</div>`;
                resultsList.prepend(el);
            } catch (e) { console.error(e); }
        }
    </script>
</body>
</html>
